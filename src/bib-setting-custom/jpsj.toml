# JPSJ: Journal of the Physical Society of Japan reference style.
# Format: T. Sasaki, T. Yokoo, S. Katano, and J. Akimitsu, J. Phys. Soc. Jpn. 74, 267 (2005).
# - 著者は "T. Sasaki" 形式、3名以上は Oxford カンマ（最後の and の前にもカンマ）
# - 誌名は ISO 略号（shortjournal を優先）、巻は太字
# - 開始ページのみ、年は括弧。Vol./No./p. は付けない
# - 論文タイトルは書かない
# This file is self-contained; edit it directly to customize the style.

year-doubling = "%year-doubling"

# 引用順に並べる（JPSJ は本文の引用順）
bib-sort = false
bib-sort-ref = true
bib-full = false

bib-cite-author = "author-set-cite"
bib-cite-year = "all-return"

bib-vancouver = "[1]"
vancouver-style = true

bib-year-doubling = "a"

# タイトルの文頭大文字化はしない（化学式が壊れる）
sentence-case-titles = false

bib-vancouver-manual = "bib-vancouver-manual-default"

[cite]
    bib-cite = ["[", "bib-citen-default", ", ", "]"]
    bib-citet = ["", "bib-citet-default", "; ", ""]
    bib-citep = ["(", "bib-citep-default", "; ", ")"]
    bib-citen = ["[", "bib-citen-default", ", ", "]"]
    bib-citefull = ["", "bib-citefull-default", "; ", ""]

# ---------------------------------------------------------------------------
# 雑誌論文: 著者, 誌名 巻, 開始頁 (年).
# ---------------------------------------------------------------------------
[entry.article]
    [entry.article.en]
        author = ["", "", "author-set-jpsj", "", ", ", [], "."]
        journal = [", ", "", "journal-abbrev", "", " ", [], " "]
        volume = ["", "", "all-bold", "", ", ", [], ", "]
        pages = ["", "", "page-set-first", "", " ", [], " "]
        year = ["", "(", "all-return", "%year-doubling", " ", [], "%year-doubling)."]
        note = ["", "", "all-return", "", ", ", [], "."]
    [entry.article.ja]
        author = ["", "", "author-set-jpsj", "", ", ", [], "."]
        journal = [", ", "", "all-return", "", " ", [], " "]
